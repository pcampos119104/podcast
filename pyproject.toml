[project]
name = "ai-podcast"
version = "0.1.0"
description = "Local Chatterbox Multilingual TTS generator"
readme = "README.md"
requires-python = "==3.14.7"
dependencies = [
    "chatterbox-tts",
    "setuptools<81",
    "soundfile",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
